services:
  - type: web
    name: openbot-web-controller
    runtime: node
    plan: free
    region: singapore
    rootDir: controller/web-server
    buildCommand: npm install && npm install --prefix server && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENBOT_USERNAME
        sync: false
      - key: OPENBOT_PASSWORD
        sync: false
      - key: OPENBOT_SESSION_SECRET
        generateValue: true
      - key: OPENBOT_ROOM_ID
        value: main
